name: azure-login-check

# Proves the keyless sign-in from GitHub Actions to Azure (OIDC federated
# credential) works end to end. Run it by hand from the Actions tab or with
# `gh workflow run azure-login-check.yml`. It only reads: it shows the
# resource group the deploy identity can reach.
on:
  workflow_dispatch:

permissions: {}

jobs:
  sign-in:
    name: sign-in
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    permissions:
      id-token: write # lets the job request an OIDC token for Azure
    steps:
      - name: Sign in to Azure with OIDC (no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show the resource group this identity deploys to
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az group show --name "$RESOURCE_GROUP" --query "{name:name, location:location, state:properties.provisioningState}" -o table
